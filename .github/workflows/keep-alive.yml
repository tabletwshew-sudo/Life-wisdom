# Keeps the free Supabase project awake: free projects pause after ~7 days
# without activity. This makes a small real request every 2 days.
#
# One-off setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL       – e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  – the anon / publishable key (safe, public key)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */2 * *'   # every 2 days at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Ping the database and login service
        run: |
          set -e
          curl -fsS -o /dev/null -w "Database API: %{http_code}\n" "$URL/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -fsS -o /dev/null -w "Login service: %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          echo "Supabase is awake ✅"

# Keeps the free Supabase project awake: free projects pause after ~7 days
# without activity. This makes a small real request every 2 days.
#
# One-off setup (GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL       – e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  – the anon / publishable key (safe, public key)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */2 * *'   # every 2 days at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Ping the database
        run: |
          set -e
          # Runs a tiny database function (supabase/migrations/…_keep_alive.sql).
          curl -fsS -X POST "$URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' \
            -w "\nDatabase: %{http_code}\n" \
            || { echo "::error::Database ping failed. Did you run supabase/migrations/20261115000700_keep_alive.sql in the SQL Editor? (404 = not run yet; 401 = wrong key)"; exit 1; }
          echo "Supabase is awake ✅"

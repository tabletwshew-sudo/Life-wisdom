# Deploys the Supabase Edge Function that sends reminders and push notifications.
# Runs automatically when the function changes, or by hand from the Actions tab.
#
# One-off setup (GitHub → your repo → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com → Account → Access Tokens → Generate new token
#   SUPABASE_PROJECT_REF   – the "abcdefgh" part of https://abcdefgh.supabase.co
name: Deploy reminder function

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-reminders
        run: supabase functions deploy send-reminders --project-ref "$PROJECT_REF" --no-verify-jwt
